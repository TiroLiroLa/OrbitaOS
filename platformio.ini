; Orbita OS - firmware do sistema (roda na particao "factory")
;
; Compilar:   pio run -e cardputer-adv
; Gravar:     tools/flash.sh <porta>      (grava bootloader Orbita + particoes + sistema)
;
; ATENCAO: "pio run -t upload" grava o bootloader PADRAO do Arduino por cima do
; bootloader Orbita. Funciona, mas o botao RST deixa de voltar ao sistema
; depois que um app externo e aberto. Prefira tools/flash.sh.

[platformio]
default_envs = cardputer-adv

[common]
; pioarduino = Arduino-ESP32 3.x (ESP-IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 1966080        ; tamanho da particao factory (0x1E0000)
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified@^0.2.8
    m5stack/M5GFX@^0.2.10

; Padrao: USB em modo OTG (TinyUSB) -> o Cardputer vira pendrive (cartao SD)
; e continua tendo serial pelo USB. Se o PC nao conseguir gravar sozinho,
; desligue, segure G0 e ligue o cabo (modo download).
[env:cardputer-adv]
extends = common
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DORBITA_USB_MSC=1
    -DCORE_DEBUG_LEVEL=1

; Alternativa sem o modo pendrive (USB nativo do chip, gravacao sempre automatica)
[env:cardputer-adv-sem-usb]
extends = common
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DORBITA_USB_MSC=0
    -DCORE_DEBUG_LEVEL=1
