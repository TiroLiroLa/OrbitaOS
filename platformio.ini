; Orbita OS - app para o M5Launcher (Cardputer ADV)
;
; Compilar:  pio run -e cardputer-adv
; Gerar os .bin para o Launcher:  tools/flash.sh --merge  (cria out/orbita-launcher.bin)

[platformio]
default_envs = cardputer-adv

[common]
; pioarduino = Arduino-ESP32 3.x (ESP-IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified@^0.2.8
    m5stack/M5GFX@^0.2.10
; A biblioteca USB do nucleo (USBMSCFS / USBHostMSC) inclui <FS.h> sem declarar
; a dependencia; sem isto o LDF nao acha o FS ao compilar a biblioteca USB.
extra_fs_include = -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

; Padrao: USB em modo OTG (TinyUSB) -> o controle de apresentacao tambem funciona
; pelo cabo (o Cardputer vira teclado USB), alem do Bluetooth.
[env:cardputer-adv]
extends = common
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DORBITA_USB_HID=1
    -DCORE_DEBUG_LEVEL=1
    ${common.extra_fs_include}

; Alternativa sem teclado USB (USB nativo do chip). A apresentacao fica so no Bluetooth.
[env:cardputer-adv-sem-usb]
extends = common
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DORBITA_USB_HID=0
    -DCORE_DEBUG_LEVEL=1
    ${common.extra_fs_include}
