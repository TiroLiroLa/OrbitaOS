# Compila o Orbita na nuvem do GitHub a cada push.
# - Arquivos prontos: Actions -> (execucao) -> Artifacts -> "orbita".
# - Na branch main, tambem vao para Releases -> "latest", com link fixo:
#   https://github.com/<usuario>/<repo>/releases/latest/download/orbita-launcher.bin
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Compilar (PlatformIO)
        run: |
          pip install platformio esptool
          set -o pipefail
          pio run -e cardputer-adv 2>&1 | tee build.log

      - name: Mostrar erros de compilacao
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "error:|Error[: ]|undefined reference|fatal error|overflowed|No such file|greater than" build.log \
            | sed 's#^/home/runner/work/[^/]*/[^/]*/##' | sort -u | head -40 \
            | while IFS= read -r l; do echo "::error::$l"; done

      - name: Empacotar
        run: |
          bash tools/flash.sh --merge
          ls -la out/
          grep -E "^(RAM|Flash):" build.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: orbita
          path: out/

      - name: Publicar em Releases (latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'OS_VERSION = "\K[^"]+' src/core/Config.h)
          cat > notes.md <<'NOTES'
          ## Instalar pelo M5Launcher

          1. Copie **`orbita-launcher.bin`** para o cartao SD.
          2. No Launcher: **SD** -> escolha o arquivo -> **Install**.
          3. O Launcher cria a particao de dados do Orbita (`orbitafs`, a "flash interna") sozinho.

          Para escolher entre o Orbita e outro firmware: ligue o Cardputer (ou aperte **BtnRst**) e aperte uma tecla na tela do Launcher.

          | Arquivo | Para que serve |
          |---|---|
          | `orbita-launcher.bin` | Orbita com a tabela de particoes. Use este no Launcher. Tambem pode ser gravado sozinho em `0x0` (sem o Launcher). |
          | `orbita-app.bin` | So o programa, sem tabela (o Launcher nao cria a flash interna; notas ficam so no SD). |
          NOTES
          sed -i 's/^          //' notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/orbita-launcher.bin out/orbita-app.bin \
            --target "$GITHUB_SHA" --latest \
            --title "Orbita $VER (build $GITHUB_RUN_NUMBER)" --notes-file notes.md
